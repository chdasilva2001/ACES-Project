<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACES</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <h1>ACES</h1>
      <p>Recursos rápidos de acessibilidade.</p>
    </header>

    <section class="card">
      <button id="toggleToolbar" class="primary">Ocultar barra</button>
      <p id="toolbarState">A barra está ativa nesta página.</p>
    </section>

    <section class="card">
      <h2>Texto</h2>
      <div class="row">
        <button data-font="-0.1">A−</button>
        <button data-font="+0.1">A+</button>
      </div>
      <input id="fontScale" type="range" min="0.8" max="1.8" step="0.1" value="1">
      <span id="fontValue">100%</span>
    </section>

    <section class="card">
      <h2>Visual</h2>
      <label><input id="contrast" type="checkbox"> Alto contraste</label>
      <label><input id="grayscale" type="checkbox"> Escala de cinza</label>
      <label><input id="invert" type="checkbox"> Inverter cores</label>
      <label><input id="highlightLinks" type="checkbox"> Destacar links</label>
      <label><input id="reduceMotion" type="checkbox"> Reduzir animações</label>
      <button id="reset" class="secondary">Restaurar</button>
    </section>

    <section class="card">
      <h2>Voz</h2>
      <p>Na página, clique em <strong>🎙 Voz</strong>. O estado da voz fica salvo para as próximas páginas.</p>
      <p class="examples">Ex.: “ler página”, “próximo botão”, “pesquisar por matemática”.</p>
    </section>

    <p id="status" role="status" aria-live="polite">Abra um site HTTP/HTTPS para usar o ACES.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
