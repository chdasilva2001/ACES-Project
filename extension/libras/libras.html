<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACES — Tradução em Libras</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #172033;
      background: #f3f5f8;
    }

    iframe {
      display: block;
      width: 100%;
      height: 75vh;
      min-height: 600px;
      border: 1px solid #667085;
      border-radius: 12px;
      background: white;
    }

    #status {
      min-height: 24px;
    }
  </style>
  <script src="libras.js" defer></script>
</head>
<body>
  <main>
    <h1>Tradução em Libras</h1>
    <p>O trecho escolhido será apresentado abaixo. A tradução utiliza o serviço online VLibras.</p>
    <p id="status" role="status" aria-live="polite">Preparando o trecho...</p>
    <iframe id="translator" title="Área de tradução do trecho com VLibras"></iframe>
  </main>
</body>
</html>
