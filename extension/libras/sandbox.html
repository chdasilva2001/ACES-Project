<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trecho para tradução</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.6;
      color: #172033;
      background: white;
    }

    #selectedText {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 20px;
      border: 1px solid #667085;
      border-radius: 8px;
    }
  </style>
  <script src="sandbox.js" defer></script>
</head>
<body>
  <main>
    <h2>Trecho selecionado</h2>
    <p id="widgetStatus" role="status" aria-live="polite">Aguardando o trecho...</p>
    <p id="selectedText"></p>
  </main>
</body>
</html>
